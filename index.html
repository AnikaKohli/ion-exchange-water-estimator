<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Hardness Estimator | Ion Exchange Ltd</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <!-- Header with Company Logo -->
    <header class="header">
      <div class="logo-wrapper">
        <img src="https://ionexchangeglobal.com/app/uploads/2022/05/ion-logo.webp" alt="Ion Exchange (India) Ltd Logo" class="company-logo" onerror="this.onerror=null; this.src='https://ionexchangeglobal.com/app/themes/ionexchange/assets/images/logo.png';">
      </div>
      <p class="subtitle">Water Hardness & Product Estimator</p>
    </header>

    <!-- STEP 1: Input Form -->
    <div id="inputCard" class="card">
      <h3>Enter Water Details</h3>

      <div class="form-group">
        <label for="waterSource">Water Source:</label>
        <select id="waterSource">
          <option value="Borewell">Borewell / Groundwater</option>
          <option value="Municipal Tap">Municipal / Tap Water</option>
          <option value="Tanker">Tanker Water</option>
          <option value="River / Lake">River / Lake</option>
        </select>
      </div>

      <div class="form-group">
        <label for="tds">TDS (Total Dissolved Solids in ppm):</label>
        <input type="number" id="tds" placeholder="e.g. 450" required>
      </div>

      <div class="form-group">
        <label for="ph">pH Level (0 – 14):</label>
        <input type="number" id="ph" step="0.1" placeholder="e.g. 7.5" required>
      </div>

      <div class="form-group">
        <label for="usage">Daily Water Usage (Liters):</label>
        <input type="number" id="usage" placeholder="e.g. 1000" required>
      </div>

      <button id="btnCalculate" class="btn">Calculate & Recommend</button>
    </div>

    <!-- STEP 2: Result Card (Hidden Initially) -->
    <div id="resultCard" class="card hidden">
      <h3>Estimation Result</h3>

      <div class="result-box">
        <p><strong>Water Category:</strong> <span id="resCategory" class="badge">Hard Water</span></p>
        <p><strong>Estimated Hardness:</strong> <span id="resHardness">270 ppm</span></p>
        <p><strong>pH Quality:</strong> <span id="resPh">Neutral (7.5)</span></p>
      </div>

      <div class="recommendation-box">
        <h4>Recommended Product:</h4>
        <p id="resProduct" class="product-name">INDION® Water Softener Series</p>
        <p id="resMessage" class="product-desc"></p>
      </div>

      <button id="btnBack" class="btn btn-secondary">← Check Another Sample</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
